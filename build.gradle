plugins {
	id 'java-library'
	id 'maven-publish'
	id 'signing'
}

sourceCompatibility = 1.17
def baseVersion = '3.9.4'
def baseGroupId = 'io.github.adempiere'

repositories {
    mavenLocal()
    mavenCentral()
}

allprojects {
    tasks.withType(Javadoc) {
    	options.addStringOption('Xdoclint:none', '-quiet')
   	}
}

dependencies {
   api fileTree(
        dir: 'lib',
        include: [
            '*.jar'
        ]
    )

	api "io.jsonwebtoken:jjwt-api:0.12.6"
	api "io.jsonwebtoken:jjwt-impl:0.12.6"
	api "io.jsonwebtoken:jjwt-jackson:0.12.6"

	//	ADempiere Core
	api "${baseGroupId}:base:${baseVersion}"
}

sourceSets {
    main {
         java {
            srcDirs = ['src/main/java']
         }
    }
}

java {
    withJavadocJar()
    withSourcesJar()
}


def entityType = 'D'
group = "io.github.adempiere"
version = System.getenv("ADEMPIERE_LIBRARY_VERSION") ?: "local-1.0.0"

jar {
	manifest {
		attributes(
			"Implementation-Title": "ADempiere JSON Web Token",
			"Implementation-Version": version,
			"EntityType": entityType
		)
    }
}

publishing {
    repositories {
		mavenLocal()

        //  This fork's own packages. Central carries upstream's artifact under the
        //  same coordinate, and what this repository builds is not that — publishing
        //  here under io.github.adempiere invites somebody to resolve one believing
        //  it is the other.
        //
        //  The property still overrides it, for a repository that genuinely
        //  publishes elsewhere.
        maven {
            url = findProperty("deployPublishUrl")
                    ?: "https://maven.pkg.github.com/erpcya/adempiere-jwt-token"
            credentials {
                username = System.getenv("GITHUB_DEPLOY_USER") ?: findProperty("sonatypeUsername")
                password = System.getenv("GITHUB_DEPLOY_TOKEN") ?: findProperty("sonatypePassword")
            }
        }
    }
    publications {
        mavenJava(MavenPublication) {
			groupId = group
			artifactId = 'adempiere-jwt-token'
			version = version
           	from components.java
           	pom {
				name = 'ADempiere JSON Web Token'
				description = 'Generate JWT for Login from third party access'
                url = 'http://adempiere.io/'
                licenses {
                    license {
                        name = 'GNU General Public License, version 2'
                        url = 'https://www.gnu.org/licenses/old-licenses/gpl-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'yamelsenih'
                        name = 'Yamel Senih'
                        email = 'ysenih@erpya.com'
                    }
                }
                scm {
                    //  The fork, not upstream. Whoever follows this from a
                    //  published artifact wants the source that produced it.
                    connection = 'scm:git:git://github.com/erpcya/adempiere-jwt-token.git'
                    developerConnection = 'scm:git:ssh://github.com/erpcya/adempiere-jwt-token.git'
                    url = 'http://github.com/erpcya/adempiere-jwt-token'
                }
            }
		}
	}
}


task cleanBuildPublishLocal(type: GradleBuild) {
	tasks = ['clean', 'build', 'publishToMavenLocal']
}


signing {
	def isReleaseVersion = !version.toString().startsWith("local") && !version.toString().endsWith("-SNAPSHOT")

	sign configurations.archives

	setRequired {
		// signing is required if this is a release version and the artifacts are to be published
		// do not use hasTask() as this require realization of the tasks that maybe are not necessary
		(isReleaseVersion || version.toString().equals("build")) && gradle.taskGraph.allTasks.any {
			it.equals(PublishToMavenRepository)
		}
	}
	def signingKey = findProperty("signingKey")
    def signingPassword = findProperty("signingPassword")
    useInMemoryPgpKeys(signingKey, signingPassword)
    sign publishing.publications.mavenJava
}
