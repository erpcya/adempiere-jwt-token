//apply plugin: 'application'
apply plugin: 'de.undercouch.download'
apply plugin: 'java-library'
apply plugin: 'maven-publish'
apply plugin: 'signing'

//startScripts.enabled = false

buildscript {
  dependencies {
    classpath "io.spring.gradle:dependency-management-plugin:1.0.9.RELEASE"
  }
  
  //Gradle Download plugin >>
  repositories {
      mavenCentral()
  }
  dependencies {
      classpath 'de.undercouch:gradle-download-task:4.1.1'
  }
  //Gradle Download plugin <<
}



sourceCompatibility = 1.8
def baseVersion = '3.9.4'
def baseGroupId = 'io.github.adempiere'
def adempiereERPVersion = '3.9.3-rs-4.3'
def libraryRepo  = "https://maven.pkg.github.com/erpya/repository"
def patchVersion = System.getenv("ADEMPIERE_LIBRARY_VERSION") ?: "local-1.0.0"

repositories {
    mavenLocal()
    mavenCentral()
}

allprojects {
    tasks.withType(Javadoc) {
    	options.addStringOption('Xdoclint:none', '-quiet')
   	}
}

dependencies {
	implementation fileTree(dir: 'lib', include: ['*.jar'])
	implementation fileTree(dir: 'dependences', include: ['*.jar'])
	implementation files("dependences/classes/")

	api "io.jsonwebtoken:jjwt-api:0.12.6"
	api "io.jsonwebtoken:jjwt-impl:0.12.6"
	api "io.jsonwebtoken:jjwt-jackson:0.12.6"

	//	ADempiere Core
	//api "${baseGroupId}:base:${baseVersion}"
}

sourceSets {
    main {
         java {
            srcDirs = ['src/main/java']
         }
    }
}

java {
    withJavadocJar()
    withSourcesJar()
}


def entityType = 'D'
group = "org.erpya.adempiere.tools"
version = System.getenv("ADEMPIERE_LIBRARY_VERSION") ?: "local-1.0.0"

jar {
	manifest {
		attributes(
			"Implementation-Title": "ADempiere JSON Web Token",
			"Implementation-Version": version,
			"EntityType": entityType
		)
    }
}

publishing {
    repositories {
		mavenLocal()
        maven {
            url = libraryRepo
            credentials {
                username = System.getenv("GITHUB_DEPLOY_USER") ?: System.properties['deploy.user']
                password = System.getenv("GITHUB_DEPLOY_TOKEN") ?: System.properties['deploy.token'] 
            }
        }
    }
    
    publications {
        mavenJava(MavenPublication) {
			groupId = group
			artifactId = 'adempiere-jwt-token'
			version = version
           	from components.java
           	pom {
				name = 'ADempiere JSON Web Token'
				description = 'Generate JWT for Login from third party access'
                url = 'http://adempiere.io/'
                licenses {
                    license {
                        name = 'GNU General Public License v3.0'
                        url = 'https://www.gnu.org/licenses/gpl-3.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'yamelsenih'
                        name = 'Yamel Senih'
                        email = 'ysenih@erpya.com'
                    }
                }
            }
		}
	}
}


task cleanBuildPublishLocal(type: GradleBuild) {
	tasks = ['clean', 'build', 'publishToMavenLocal']
}


signing {
	def isReleaseVersion = !version.toString().startsWith("local") && !version.toString().endsWith("-SNAPSHOT")

	sign configurations.archives

	setRequired {
		// signing is required if this is a release version and the artifacts are to be published
		// do not use hasTask() as this require realization of the tasks that maybe are not necessary
		(isReleaseVersion || version.toString().equals("build")) && gradle.taskGraph.allTasks.any {
			it.equals(PublishToMavenRepository)
		}
	}
	def signingKey = findProperty("signingKey")
    def signingPassword = findProperty("signingPassword")
    useInMemoryPgpKeys(signingKey, signingPassword)
    sign publishing.publications.mavenJava
}

task refreshDependences(){
	//delete fileTree('dependences')
	file('dependences').mkdirs()
	file('dependences/tmp/').mkdirs()
	file('dependences/webuiClass').mkdirs()
	doLast {
		download {
            src 'http://github.com/erpcya/adempiere/releases/download/' + adempiereERPVersion + '/Adempiere_393LTS.tar.gz'
            dest 'dependences/tmp/Adempiere_393LTS.tar.gz'
            overwrite false
        }
        
        copy {
            from tarTree(resources.gzip('dependences/tmp/Adempiere_393LTS.tar.gz'))
            into 'dependences/tmp'
        }
        
        copy {
            from zipTree('dependences/tmp/Adempiere/lib/webui.war')
            into 'dependences/webuiClass/'
        }
        
        copy {
        	from "dependences/tmp/Adempiere/lib"
        	into "dependences"
        	include "*.jar"
    	}
    	
        copy {
        	from fileTree('dependences/tmp/Adempiere/packages/').filter { it.isFile()}
        	into "dependences"
        	include "*.jar"
    	}
    	
    	copy {
        	from "dependences/webuiClass/WEB-INF/lib"
        	into "dependences"
        	include "*.jar"
    	}
    	
    	copy {
	        from "dependences/webuiClass/WEB-INF/classes"
	        into "dependences/classes"
    	}
    	
    	file('dependences/tmp/').deleteDir()
    	file('dependences/webuiClass/').deleteDir()
	}
}
